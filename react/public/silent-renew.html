<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Silent Renew</title>
    <script src="https://cdn.jsdelivr.net/npm/oidc-client-ts@3.0.1/dist/browser/oidc-client-ts.min.js"></script>
  </head>
  <body>
    <script>
      (function () {
        var FALLBACK = {
          authority: "https://localhost:44320/",
          client_id: "AcroStack_App",
          scope: "offline_access AcroStack",
        };
        fetch("/dynamic-env.json", { cache: "no-store" })
          .then(function (res) {
            return res.ok ? res.json() : null;
          })
          .catch(function () {
            return null;
          })
          .then(function (env) {
            var oauth = (env && env.oAuthConfig) || {};
            var authority = oauth.issuer || FALLBACK.authority;
            if (authority.charAt(authority.length - 1) !== "/") authority += "/";
            new Oidc.UserManager({
              authority: authority,
              client_id: oauth.clientId || FALLBACK.client_id,
              redirect_uri: window.location.origin + "/silent-renew.html",
              scope: oauth.scope || FALLBACK.scope,
              response_type: "code",
            }).signinSilentCallback();
          });
      })();
    </script>
  </body>
</html>
