packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@types/react": ^19
  "@types/react-dom": ^19
  lucide-react: ^1.47.0
  react: ^19
  react-dom: ^19
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
