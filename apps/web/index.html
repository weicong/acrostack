<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TanStack Router + shadcn/ui</title>
    <script>
      // Apply the persisted theme before first paint so there is no flash of the
      // wrong palette. Kept inline on purpose: it must run before React mounts.
      // Keys and class names mirror ThemeProvider: mode under "ui-theme",
      // palette ("风格") under "ui-theme-style" → `theme-default` / `theme-fluent`.
      (function () {
        try {
          var stored = localStorage.getItem("ui-theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement.classList;
          root.add(dark ? "dark" : "light");

          var style = localStorage.getItem("ui-theme-style");
          root.add(style === "fluent" ? "theme-fluent" : "theme-default");
        } catch (_) {
          document.documentElement.classList.add("light", "theme-default");
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
