services:
  acrostack-web:
    image: acrostack-web:latest
    container_name: acrostack-web
    build:
      context: ../../../
      dockerfile: react/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - acrostack-api
    volumes:
      - ./dynamic-env.json://usr/share/nginx/html/dynamic-env.json
    networks:
      - abp-network  

  acrostack-api:
    image: acrostack-api:latest
    container_name: acrostack-api-container
    build:
      context: ../../
      dockerfile: AcroStack/Dockerfile.local
    environment:
      - ASPNETCORE_URLS=https://+:8081;http://+:8080;
      - Kestrel__Certificates__Default__Path=/app/certs/localhost.pfx
      - Kestrel__Certificates__Default__Password=91f91912-5ab0-49df-8166-23377efaf3cc
      - App__SelfUrl=https://localhost:44317
      - App__ReactUrl=http://localhost:5173
      - App_CorsOrigins=http://localhost:5173
      - App__RedirectAllowedUrls=http://localhost:5173
      - App__HealthCheckUrl=http://acrostack:8080/health-status
      - AuthServer__Authority=http://acrostack-api:8080
      - AuthServer__RequireHttpsMetadata=false
      - AuthServer__SetSelfAsIssuer=true 
      - ConnectionStrings__Default=DataSource=/data/AcroStack.db
    ports:
      - "44317:8081"
    depends_on:
      sqlite:
        condition: service_healthy
    restart: on-failure    
    volumes:
      - sqlite_data:/data
      - ./certs:/app/certs
    networks:
      - abp-network  
  
  db-migrator:
    image: acrostack-api:latest
    container_name: db-migrator
    build:
      context: ../../
      dockerfile: AcroStack/Dockerfile.local
    environment:
      - ConnectionStrings__Default=DataSource=/data/AcroStack.db
    command:
      - --migrate-database
    depends_on:
      sqlite:
        condition: service_healthy
    volumes:
      - sqlite_data:/data
    networks:
      - abp-network
  sqlite:
    container_name: sqlite-container
    image: alpine:latest
    command: sh -c "apk add sqlite && touch /data/AcroStack.db && sqlite3 /data/AcroStack.db '.databases' && tail -f /dev/null"
    environment:
      - TZ=UTC
    volumes:
      - sqlite_data:/data
    networks:
      - abp-network
    healthcheck:
      test: ["CMD-SHELL", "if [ -f /data/AcroStack.db ]; then exit 0; else exit 1; fi"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  sqlite_data:
    name: acrostack_sqlite_data
networks:
  abp-network:
    name: acrostack-network
    driver: bridge